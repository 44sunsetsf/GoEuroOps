# GoEuroOps 一键启动：后端 + 前端 + Redis + ChromaDB + Prometheus
#
#   docker compose up -d --build     首次构建并启动
#   之后可以直接在 Docker Desktop 里点 goeuroops 项目的启动/停止
#
# 需要先在本文件同目录创建 .env（cp .env.example .env）并填入 ANTHROPIC_API_KEY。

name: goeuroops

services:

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-goeuroops123}
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-goeuroops123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chromadb:
    image: chromadb/chroma:0.5.23
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - chromadb-data:/chroma/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/api/v1/heartbeat || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  prometheus:
    image: prom/prometheus:latest
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=200h'
    ports:
      - "9090:9090"
    volumes:
      - ./backend/config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    networks:
      default:
        # prometheus.yml 里抓取的主机名是 goeuroops
        aliases:
          - goeuroops
    ports:
      - "8000:8000"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?请先复制 .env.example 为 .env 并填入 ANTHROPIC_API_KEY}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-deepseek-v4-pro}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-https://api.deepseek.com/anthropic}
      APP_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      REDIS_URL: redis://:${REDIS_PASSWORD:-goeuroops123}@redis:6379/0
      CHROMA_HOST: chromadb
      CHROMA_PORT: "8000"
      CHROMA_PERSIST_DIRECTORY: /app/data/chroma
      EVAL_BASELINE_PATH: /app/data/eval/baseline.json
      GOEUROOPS_SKILLS_DIR: /app/skills
      PROMETHEUS_PORT: "9091"
      MONITOR_INTERVAL: "10"
    volumes:
      - backend-data:/app/data
      - backend-logs:/app/logs
      # Skills 可以在不重建镜像的情况下热加载：改文件后 POST /skills/reload
      - ./backend/skills:/app/skills
    depends_on:
      redis:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_URL: /api
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  redis-data:
  chromadb-data:
  prometheus-data:
  backend-data:
  backend-logs:
