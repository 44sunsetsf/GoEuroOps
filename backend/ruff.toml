# 代码检查（CI 里运行）。只开真正能抓到 bug 的规则，不做风格大扫除：
#   E4/E7/E9：导入位置、语句写法、语法错误；F：未定义、未使用的名字等（pyflakes）
#   S110：except 里直接 pass，异常被静默吞掉（要么记日志，要么写清为什么可以忽略）
target-version = "py312"
line-length = 130
extend-exclude = [".venv", ".venv-mcp"]

[lint]
select = ["E4", "E7", "E9", "F", "S110"]

[lint.per-file-ignores]
# 入口文件要先把 backend 目录加进 sys.path 再导入项目模块
"api/main.py" = ["E402"]
