# Prometheus 配置文件 — GoEuroOps 留学业务智能运营中枢

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'goeuroops'
    environment: 'production'

rule_files:
  - "alerts/*.yml"

scrape_configs:
  # GoEuroOps 主应用指标
  - job_name: 'goeuroops-app'
    static_configs:
      - targets: ['goeuroops:8000']
        labels:
          service: 'goeuroops'
    scrape_interval: 10s
    metrics_path: '/metrics'

  # Prometheus 自监控
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
