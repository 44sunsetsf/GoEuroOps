# 对话接口按访问者 IP 限流：每分钟 6 次，允许短时连发 4 次。
# 只在公网部署时生效：请求经 Caddy 转发（带 X-Forwarded-For）才限流；
# 本地直接访问时 key 为空，nginx 不对空 key 计数，开发调试不受影响。
# Caddy 在容器网段 172.16.0.0/12，用它转发来的 X-Forwarded-For 取真实 IP。
map $http_x_forwarded_for $chat_limit_key {
    ""      "";
    default $binary_remote_addr;
}
limit_req_zone $chat_limit_key zone=chat:10m rate=6r/m;

server {
    listen 80;
    server_name _;

    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 127.0.0.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 10M;

    location = /runtime-config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Swagger UI（/api/docs）会去请求站点根路径下的 /openapi.json，
    # 不转发的话会被上面的 SPA 回退到 index.html，页面就是空白的。
    location = /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
    }

    location /api/chat {
        limit_req zone=chat burst=4 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000/chat;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        # /chat/stream 是 SSE 流式响应，必须关闭缓冲才能逐 token 显示
        proxy_buffering off;
        proxy_cache off;
    }
}
