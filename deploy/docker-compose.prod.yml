# 公网部署：在默认 compose 之上叠加
#   docker compose -f docker-compose.yml -f deploy/docker-compose.prod.yml up -d --build
#
# 变化：
#   - Caddy 接管 80/443，自动申请 HTTPS 证书，并给学生端以外的页面和接口加口令
#   - 后端、前端不再直接暴露端口，只能经 Caddy 访问
#   - 对话接口有每日上限（GOEUROOPS_DAILY_CHAT_LIMIT）
#   - Prometheus 默认不启动（小内存机器上省 120MB），需要时加 --profile monitoring
#   - ChromaDB 改为后端进程内嵌入式，省掉约 210MB 的 chromadb 容器
#   - 向量模型仍在本地跑（bge-small-zh，与评测基准一致）；内存特别紧时可改用远端 API：
#     设 GOEUROOPS_EMBEDDING_PROVIDER=api 和 GOEUROOPS_EMBEDDING_API_KEY，后端常驻内存可再降约 240MB

# 容器日志默认不轮转，长期运行会越积越大：每个容器最多 3 个 10MB 文件
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  caddy:
    <<: *logging
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?在 .env 里设置 SITE_ADDRESS，例如 47.84.60.190.sslip.io}
      GOEUROOPS_ADDRESS: ${GOEUROOPS_ADDRESS:-${SITE_ADDRESS}}
      STUDIO_USER: ${STUDIO_USER:-studio}
      STUDIO_PASSWORD_HASH: ${STUDIO_PASSWORD_HASH:?在 .env 里设置 STUDIO_PASSWORD_HASH，见 deploy/DEPLOY.md}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./deploy/sites:/etc/caddy/sites:ro
      # 同机静态站点的文件（例如个人主页），不设时为空目录
      - ${CADDY_STATIC_DIR:-./deploy/static}:/srv:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - frontend
    restart: unless-stopped

  frontend:
    <<: *logging
    ports: !reset []

  backend:
    <<: *logging
    ports: !reset []
    environment:
      GOEUROOPS_DAILY_CHAT_LIMIT: ${GOEUROOPS_DAILY_CHAT_LIMIT:-200}
      GOEUROOPS_EMBEDDING_PROVIDER: ${GOEUROOPS_EMBEDDING_PROVIDER:-local}
      GOEUROOPS_EMBEDDING_API_KEY: ${SILICONFLOW_API_KEY:-}
      CHROMA_HOST: ""
      # 小内存机器：减少 glibc 内存碎片；向量推理只用 1 个线程，启动时不会占满 CPU
      MALLOC_ARENA_MAX: "2"
      # 释放的内存及时还给系统，而不是留在 glibc 的空闲链表里
      MALLOC_TRIM_THRESHOLD_: "65536"
      OMP_NUM_THREADS: "1"
    depends_on: !reset
      redis:
        condition: service_healthy
    # 超出上限时只重启后端容器，不会拖垮整台机器
    mem_limit: 900m
    memswap_limit: 1200m

  chromadb:
    profiles: ["chroma-server"]

  prometheus:
    <<: *logging
    profiles: ["monitoring"]

  redis:
    <<: *logging

volumes:
  caddy-data:
  caddy-config:
